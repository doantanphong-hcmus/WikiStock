services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wikistock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wikistock}
      POSTGRES_DB: ${POSTGRES_DB:-wikistock}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_API_BASE_URL: ${CLAUDE_API_BASE_URL:-https://claude.zunef.com/v1/ai}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      CLAUDE_CONNECT_TIMEOUT_SECONDS: ${CLAUDE_CONNECT_TIMEOUT_SECONDS:-5}
      CLAUDE_READ_TIMEOUT_SECONDS: ${CLAUDE_READ_TIMEOUT_SECONDS:-45}
      SEED_DATA_PATH: /data/seed_data
      MAX_PDF_SIZE_MB: ${MAX_PDF_SIZE_MB:-100}
      CHUNK_SIZE_CHARS: ${CHUNK_SIZE_CHARS:-1800}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-200}
      CHUNK_VERSION: ${CHUNK_VERSION:-v1-page-block-1800-200}
      DATABASE_URL: postgresql://${POSTGRES_USER:-wikistock}:${POSTGRES_PASSWORD:-wikistock}@postgres:5432/${POSTGRES_DB:-wikistock}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./docs/Seed_Daa/Báo cáo tài chính:/data/seed_data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AI_SERVICE_URL: http://ai-service:8000
      AI_DEMO_MODE: ${AI_DEMO_MODE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-wikistock}:${POSTGRES_PASSWORD:-wikistock}@postgres:5432/${POSTGRES_DB:-wikistock}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
    environment:
      API_BASE_URL: http://backend:3001/api/v1
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
