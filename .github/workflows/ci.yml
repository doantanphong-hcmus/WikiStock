name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        env:
          # Placeholder URL so prisma validate/generate can run without a real DB.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wikistock?schema=public
          JWT_SECRET: ci-placeholder-secret-not-used-in-prod
          JWT_EXPIRES_IN_SECONDS: '3600'
          AI_SERVICE_URL: http://localhost:8000
          FRONTEND_URL: http://localhost:3000
        run: npm ci

      - name: Prisma validate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wikistock?schema=public
        run: npx prisma validate

      - name: Prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wikistock?schema=public
        run: npx prisma generate

      - name: Lint (read-only)
        working-directory: backend
        run: npm run lint:check

      - name: Prettier (read-only)
        working-directory: backend
        run: npm run format:check

      - name: Unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wikistock?schema=public
          JWT_SECRET: ci-placeholder-secret-not-used-in-prod
          JWT_EXPIRES_IN_SECONDS: '3600'
          AI_SERVICE_URL: http://localhost:8000
          FRONTEND_URL: http://localhost:3000
        run: npm test -- --runInBand

      - name: Build
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wikistock?schema=public
          JWT_SECRET: ci-placeholder-secret-not-used-in-prod
          JWT_EXPIRES_IN_SECONDS: '3600'
          AI_SERVICE_URL: http://localhost:8000
          FRONTEND_URL: http://localhost:3000
        run: npm run build

      - name: Ensure worktree is clean
        working-directory: backend
        run: git diff --exit-code

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          # Build-time placeholder, only used by Next.js client bundle. The CI job
          # never calls the backend at runtime.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
        run: npm run build

  ai-service-quality:
    name: ai-service-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: ai-service
        run: python -m unittest discover -s tests

      - name: Compile Python sources
        working-directory: ai-service
        run: python -m compileall -q .

  container-build:
    name: container-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.10.0

      - name: Validate compose file
        env:
          JWT_SECRET: ci-placeholder-secret-not-used-in-prod
        run: docker compose config

      - name: Build backend image
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.10.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: wikistock/backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ai-service image
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.10.0
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
          tags: wikistock/ai-service:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.10.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: wikistock/frontend:ci-${{ github.sha }}
          # Only a public, build-time placeholder. No secrets are baked into the image.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:3001/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
